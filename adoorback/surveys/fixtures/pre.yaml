# ============================================================================
# MID-STUDY & POST-STUDY EVALUATION (4 surveys, 1 file)
# ============================================================================
# Surveys produced by this file:
#   1. mid_study_w   — Phase 1 evaluation for users on Ver.W
#   2. mid_study_q   — Phase 1 evaluation for users on Ver.Q
#   3. post_study_w  — Phase 2 evaluation for users on Ver.W
#   4. post_study_q  — Phase 2 evaluation for users on Ver.Q
#
# Survey routing happens OUTSIDE this YAML. The scheduling layer maps each
# (user_id, phase_number) to the user's assigned version and serves the
# corresponding survey on day 14 (mid) or day 28 (post). No `phase_version`
# self-report item exists in any of these surveys — version is treated as
# known ground truth.
#
# Friend visibility: OFF for all four surveys
# Results page: HIDDEN for all four surveys
#
# Estimated lengths:
#   - Ver.W surveys: ~30 min
#   - Ver.Q surveys: ~17 min
#
# Shared structure (anchored, reused across all 4 surveys):
#   tie_outcomes_block         — 7 items (6 outcomes + 1 new-tie)
#   global_outcomes_block      — 12 items
#   goal_outcome_ratings_block — 8 items (one outcome rating per goal,
#                                shown on BOTH versions)
#   reflection_block           — 3 items (closer / not-closer free text)
#   wrapup_block               — 9 items (continue, recommend, like/change,
#                                difficult, interview, anything else)
#
# Version-specific blocks:
#   ver_w_feature_blocks       — per-feature satisfaction for goals 1–8
#                                (each goal's features evaluated together)
#   ver_q_feature_blocks       — per-feature satisfaction for goal 1
#                                (daily questions, question sending) and
#                                goal 7 (scrollable Discover feed)
#
# Composition pattern (per survey):
#   §0 intro
#   §1 tie_outcomes_block          [shared]
#   §2 global_outcomes_block       [shared]
#   §3 per-goal blocks:
#       goal_outcome_ratings_block [shared, one rating per goal]
#       INTERLEAVED with version-specific feature satisfaction blocks
#       (only on goals where the version has features)
#   §4 reflection_block            [shared]
#   §5 wrapup_block                [shared]
#
# IMPORTANT: Because per-goal blocks interleave a shared outcome rating with
# version-specific features, the §3 section cannot be a single anchor — it's
# composed survey-by-survey below.
#
# ============================================================================
# IMPLEMENTATION NOTES FOR CLAUDE CODE
# ============================================================================
#
# The four surveys at the bottom of this file each have:
#   - slug, title, description, tokens (phase_label, phase_window, phase_number)
#   - questions: a list composed by reference to anchored blocks plus
#     interleaved per-goal subsequences
#
# Order numbers within each survey are assigned at build time by the loader
# based on list position. Inside each anchored block, the order field is
# present but should be treated as RELATIVE to the block — the loader
# renumbers absolutely after composition.
#
# All schema features used here are the same as in mid_study/post_study
# from the prior single-file draft, MINUS conditional_display on every
# question (since version routing is now handled at the survey-assignment
# layer).
#
# Token substitution {{phase_label}}, {{phase_window}}, {{phase_number}}
# resolves against each survey's tokens block at render time.
# ============================================================================


# ============================================================================
# ANCHOR DEFINITIONS — shared building blocks
# ============================================================================

# Block 1 — Tie-level outcomes (7 items)
_tie_outcomes_block: &tie_outcomes_block
  - order: 1
    slug: tie_block_intro
    type: display_only
    content:
      en: "**Your relationships on WIT during {{phase_label}}.** Think about all the friends you interacted with — old friends, new friends, anyone in between. Answer based on your overall experience over {{phase_window}}."

  - order: 2
    slug: tie_intimacy
    type: likert_5
    prompt:
      en: "My interactions on WIT during {{phase_label}} made me feel closer to my friends."
    low_label:  { en: "Strongly disagree" }
    high_label: { en: "Strongly agree" }
    reverse_scored: false
    result_hidden: true

  - order: 3
    slug: tie_trust
    type: likert_5
    prompt:
      en: "My interactions on WIT during {{phase_label}} made me feel more trusting toward my friends."
    low_label:  { en: "Strongly disagree" }
    high_label: { en: "Strongly agree" }
