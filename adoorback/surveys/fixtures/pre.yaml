  - order: 5
    slug: tie_attention
    type: likert_5
    prompt:
      en: "I felt my posts received attention or responses from friends during {{phase_label}}."
    low_label:  { en: "Strongly disagree" }
    high_label: { en: "Strongly agree" }
    reverse_scored: false
