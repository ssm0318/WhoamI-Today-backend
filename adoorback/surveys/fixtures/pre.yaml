# ============================================================================
# GLOBAL APPRECIATE / NOT-APPRECIATE BLOCK (shared, mid + post)
# Two quick free-text items framing who the current version is and isn't for.
# Uses {{version_short_letter}} so the same anchor serves both W and Q surveys.
# ============================================================================

_global_appreciate_block: &global_appreciate_block
  - order: 1
    slug: would_appreciate_intro
    type: display_only
    content:
      en: "**Two quick questions about who Ver.{{version_short_letter}} is for.**"

  - order: 2
    slug: would_appreciate
    type: free_text
    prompt:
      en: "What kinds of people do you think would appreciate Ver.{{version_short_letter}} the most? Be specific."
    placeholder:
      en: "Specific descriptors are more useful than 'people who like X.'"
    min_length: 20
    required: true
    result_hidden: true

  - order: 3
    slug: would_not_appreciate
    type: free_text
    prompt:
      en: "What kinds of people do you think would dislike Ver.{{version_short_letter}} the most? Be specific."
    placeholder:
      en: "Specific descriptors are more useful than 'people who don't like X.'"
    min_length: 20
    required: true
    result_hidden: true


# ============================================================================
# PREFERRED VERSION BLOCK (shared, post-study only)
# After both phases are done, participants have used both Ver.W and Ver.Q
# and can compare directly.
# ============================================================================

_preferred_version_block: &preferred_version_block
  - order: 1
    slug: preferred_version_intro
    type: display_only
    content:
      en: "**Looking back at both halves.** You've now used both Ver.W and Ver.Q."

  - order: 2
    slug: preferred_version
    type: single_choice
    prompt:
      en: "Which version would you actually prefer to use going forward?"
    options:
      - { order: 1, value: "ver_w",       label: { en: "Ver.W (with check-ins, missions, daily digest)" } }
      - { order: 2, value: "ver_q",       label: { en: "Ver.Q (with prominent daily questions and scrollable Discover)" } }
      - { order: 3, value: "cant_decide", label: { en: "I really can't decide" } }
      - { order: 4, value: "neither",     label: { en: "Honestly, neither — I'd want something different" } }
      - { order: 5, value: "other",       label: { en: "Other (specify below)" } }
    required: true
    result_hidden: true

  - order: 3
    slug: preferred_version_reason
    type: free_text
    prompt:
      en: "Could you briefly explain your choice?"
    placeholder:
      en: "Even a few sentences helps."
    min_length: 20
    required: true
    result_hidden: true


