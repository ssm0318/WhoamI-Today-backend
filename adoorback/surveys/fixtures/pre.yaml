# ============================================================================
# REFLECTION + WRAPUP BLOCKS (shared)
# ============================================================================

_reflection_block: &reflection_block
  - order: 1
    slug: closer_block_intro
    type: display_only
    content:
      en: "**A couple of questions about specific friends.** These give us the most useful detail when answers are concrete."

  - order: 2
    slug: closer_friend
    type: free_text
    prompt:
      en: "Was there a specific friend you felt closer to during {{phase_label}}? If so, what's their current username, and what experiences on WIT do you think helped that happen?"
    placeholder:
      en: "Username + a sentence or two on what experiences on WIT contributed."
    required: false
    result_hidden: true

  - order: 3
    slug: not_closer_friend
    type: free_text
    prompt:
      en: "Was there a friend you weren't able to feel closer to during {{phase_label}}? If so, what's their current username, and why do you think that didn't happen?"
    placeholder:
      en: "Username + a sentence or two on why it didn't happen."
    required: false
    result_hidden: true


_wrapup_block: &wrapup_block
  - order: 1
    slug: wrapup_block_intro
    type: display_only
    content:
      en: "**Last few questions.**"

  - order: 2
    slug: continue_using
    type: likert_5
    prompt:
      en: "I would like to continue using this version of WIT after the research study is over."
    low_label:  { en: "Strongly disagree" }
    high_label: { en: "Strongly agree" }
    reverse_scored: false
    result_hidden: true

  - order: 3
    slug: continue_reason
    type: free_text
    prompt:
      en: "Could you briefly explain the reason for your choice above?"
    required: false
    result_hidden: true

  - order: 4
    slug: recommend
    type: likert_5
    prompt:
      en: "I would recommend WIT during {{phase_label}} to others based on my experience."
    low_label:  { en: "Strongly disagree" }
    high_label: { en: "Strongly agree" }
    reverse_scored: false
    result_hidden: true

  - order: 5
    slug: wit_like
    type: free_text
    prompt:
      en: "What is one thing you liked most about WIT during {{phase_label}}?"
    required: false
    result_hidden: true

  - order: 6
    slug: wit_change
    type: free_text
    prompt:
      en: "What is one thing you would most like to change about WIT during {{phase_label}}?"
    required: false
    result_hidden: true

  - order: 7
    slug: difficult_reason
    type: free_text
    prompt:
      en: "If there were moments during {{phase_label}} that were difficult to share, when did you feel that the most? (Write N/A if not applicable.)"
    required: false
    result_hidden: true

  - order: 8
    slug: interview_willing
    type: single_choice
    prompt:
      en: "Would you be open to being contacted for a short follow-up interview? It would happen later this year and take around 30 minutes."
    options:
      - { order: 1, value: "yes",   label: { en: "Yes, sure" } }
      - { order: 2, value: "maybe", label: { en: "Maybe — depends on timing" } }
      - { order: 3, value: "no",    label: { en: "No thanks" } }
    result_hidden: true

  - order: 9
    slug: anything_else
    type: free_text
    prompt:
      en: "Last question — anything else you'd like to share with us about {{phase_label}}?"
    required: false
    result_hidden: true


