    result_hidden: true

  - order: 8
    slug: tie_new_closer
    type: likert_5_na
    prompt:
      en: "Through WIT during {{phase_label}}, I felt closer to people I didn't know well before."
    description:
      en: "By 'didn't know well' we mean people you'd describe as acquaintances, classmates you weren't close with, friends-of-friends, or new connections."
