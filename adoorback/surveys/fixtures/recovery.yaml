# ============================================================================
# DYNAMIC RECOVERY SURVEYS
# ============================================================================
# These surveys are participant-facing containers for final-schema questions
# that may still be needed from people who answered an older deployed version.
# The API filters questions per user using recovery_question_map.yaml, so a
# participant only sees questions they personally still need to answer.
# ============================================================================

- slug: study_endpoint_part2
  type: likert_5
  title:
    en: 'What happens next with WIT: Part 2'
  description:
