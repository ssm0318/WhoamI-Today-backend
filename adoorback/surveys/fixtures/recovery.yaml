    reverse_scored: false
    result_hidden: true
    embedded_data: false
    options:
    - order: 1
      value: never
      label:
        en: Never
    - order: 2
      value: less_than_weekly
      label:
        en: Less than once a week
    - order: 3
      value: about_weekly
      label:
        en: About once a week
    - order: 4
      value: every_few_days
      label:
        en: Every few days
    - order: 5
      value: about_daily
      label:
        en: About once a day
    - order: 6
      value: multiple_daily
