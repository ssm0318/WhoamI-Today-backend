# ============================================================================
- slug: week2_reflection
  type: likert_5
  title:
    en: "Looking back: Week 2"
  description:
    en: "A short reflection on your second week with WIT."
  interpretation:
    en: "Tomorrow's digest will show how Week 2 compares to Week 1 across the cohort."
  friend_visible: false
  results_hidden: false
  tokens:
    week_label: "Week 2"
    week_label_lower: "week 2"
    week_number: 2

