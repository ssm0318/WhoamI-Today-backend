# ============================================================================
# SURVEY — anytime_reflection (full 28-day window, repeatable)
# ============================================================================
# Opt-in feedback channel. Users can submit as many times as they want
# throughout the study, each submission tagged by category.
#
# Categories: mission suggestion, daily question suggestion, survey-of-the-day
# suggestion, bug report, feature feedback, feature request, other.
#
# Friend visibility: OFF
# Results: HIDDEN (private feedback, not for digests)
#
# Severity / frequency questions use likert scales rather than ordinal
# multi-choice so the data is analyzable as continuous (means, sums,
# distributions) rather than just modal-category counts.

- slug: anytime_reflection
  type: single_choice
  title:
    en: "Drop us a note"
  description:
    en: "Got something to share that doesn't fit the other surveys? Bug, idea, mission suggestion, question for the cohort, weird thing that happened — submit as many times as you want."
  interpretation:
    en: ""
  friend_visible: false
  results_hidden: true
  repeatable: true
  # Always-on drop-in feedback channel; sits below endpoint / daily /
  # weekly cards in the index but stays accessible throughout the study.
  priority: 20
  point_value: 3

  questions:

    # The category-select is the first question. Previously preceded by
    # a `display_only` "Quick note" intro — removed because it added a
    # forced tap that didn't carry information.
    - order: 1
      slug: anytime_category
      type: single_choice
      prompt:
        en: "What kind of feedback is this?"
      options:
        - { order: 1, value: "mission_suggest",
            label: { en: "💡 Suggest a mission of the day" } }
        - { order: 2, value: "daily_question_suggest",
            label: { en: "❓ Suggest a daily question" } }
        - { order: 3, value: "survey_of_day_suggest",
            label: { en: "📊 Suggest a survey of the day" } }
        - { order: 4, value: "bug_report",
            label: { en: "🐛 Report a bug or technical issue" } }
        - { order: 5, value: "feature_feedback",
            label: { en: "💬 Share feedback on an existing feature" } }
        - { order: 6, value: "feature_request",
            label: { en: "🔮 Suggest a feature we don't have" } }
        - { order: 7, value: "other",
            label: { en: "✏️ Something else" } }
      required: true
      result_kind: option_counts
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 1 — Mission of the day suggestion
    # ------------------------------------------------------------------------
    - order: 2
      slug: mission_suggestion_text
      type: free_text
      prompt:
        en: "What mission would you like us to add? Write it the way you'd want it to appear on the app."
      placeholder:
        en: "e.g., 'Send a song that reminded you of someone today,' or 'Take a photo of something blue you noticed.'"
      min_length: 0
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "mission_suggest"
      result_hidden: true

    - order: 3
      slug: mission_suggestion_why
      type: free_text
      prompt:
        en: "Why this mission? (Optional)"
      min_length: 0
      required: false
      conditional_display:
        depends_on: anytime_category
        show_when_value: "mission_suggest"
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 2 — Daily question suggestion
    # ------------------------------------------------------------------------
    # Daily question = a self-reflection prompt that the user answers about
    # themselves, no structured options. Kept separate from survey-of-the-day
    # because the format and placeholder differ.
    - order: 4
      slug: daily_question_suggestion_text
      type: free_text
      prompt:
        en: "What daily question would you like us to add? Write it the way you'd want to see it."
      placeholder:
        en: "e.g., 'What's something small that made you feel seen today?' or 'Which part of your routine actually works for you?'"
      min_length: 0
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "daily_question_suggest"
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 3 — Survey-of-the-day suggestion
    # ------------------------------------------------------------------------
    # Survey of the day = a structured-option questionnaire that produces an
    # aggregate visualization the next day. Different format than a daily
    # question; sketch-the-options style answers help us scope it.
    - order: 5
      slug: survey_of_day_suggestion_text
      type: free_text
      prompt:
        en: "What survey of the day would you like us to add? Sketch the question and what the options might look like."
      placeholder:
        en: "e.g., 'How often do you reread your own old posts?' with options Never / Once / A few times / Often."
      min_length: 0
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "survey_of_day_suggest"
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 4 — Bug report
    # ------------------------------------------------------------------------
    - order: 6
      slug: bug_what_happened
      type: free_text
      prompt:
        en: "What happened? Walk us through it."
      placeholder:
        en: "What you tried to do, what happened instead, what part of the app it was in. The more specific the better."
      min_length: 0
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "bug_report"
      result_hidden: true

    # Severity is ordinal — represented as likert_5 so we get a continuous
    # score (mean / distribution) instead of a categorical mode.
    - order: 7
      slug: bug_severity
      type: likert_5
      prompt:
        en: "How disruptive was it?"
      low_label:
        en: "Barely noticeable"
      high_label:
        en: "Completely blocking"
      reverse_scored: false
      result_kind: aggregated_likert
      result_group: bug_severity
      result_hidden: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "bug_report"

    # Reproducibility is ordinal frequency. Likert_5_NA so "not sure" can be
    # captured as N/A (skipped from scoring) rather than collapsed into a
    # numeric option that distorts the mean.
    - order: 8
      slug: bug_reproducible
      type: likert_5_na
      prompt:
        en: "How often does this happen?"
      low_label:
        en: "Once only"
      high_label:
        en: "Every time"
      na_option:
        en: "Not sure"
      reverse_scored: false
      result_kind: aggregated_likert
      result_group: bug_reproducible
      result_hidden: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "bug_report"

    # ------------------------------------------------------------------------
    # CATEGORY 5 — Feature feedback
    # ------------------------------------------------------------------------
    - order: 9
      slug: feature_feedback_which
      type: multi_choice
      prompt:
        en: "Which feature(s) is this about? Pick all that apply."
      options:
        - { order: 1, value: "daily_questions",       label: { en: "Daily questions" } }
        - { order: 2, value: "question_sending",      label: { en: "Question sending" } }
        - { order: 3, value: "mission_of_day",        label: { en: "Mission of the day" } }
        - { order: 4, value: "survey_of_day",         label: { en: "Survey of the day / daily digest" } }
        - { order: 5, value: "check_ins",             label: { en: "Check-ins (mood, status, song, battery)" } }
        - { order: 6, value: "private_comments",      label: { en: "Private comments" } }
        - { order: 7, value: "emoji_reactions",       label: { en: "Emoji reactions" } }
        - { order: 8, value: "browsing_modes",        label: { en: "Browsing modes (quiet/social)" } }
        - { order: 9, value: "close_friend_filter",   label: { en: "Close-friend filter" } }
        - { order: 10, value: "profile_decoration",   label: { en: "Profile chips, pinned check-ins, persona" } }
        - { order: 11, value: "discover_feed",        label: { en: "Discover feed" } }
        - { order: 12, value: "view_as",              label: { en: "View as / privacy controls" } }
        - { order: 13, value: "shared_playlist",      label: { en: "Shared playlist" } }
        - { order: 14, value: "widget",               label: { en: "Widget" } }
        - { order: 15, value: "other",                label: { en: "Other (specify in next field)" } }
      conditional_display:
        depends_on: anytime_category
        show_when_value: "feature_feedback"
      result_hidden: true

    - order: 10
      slug: feature_feedback_text
      type: free_text
      prompt:
        en: "What's your feedback on this feature? Both 'this works great' and 'this is frustrating' are useful."
      placeholder:
        en: "What works, what doesn't, what you wish were different."
      min_length: 0
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "feature_feedback"
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 6 — Feature request
    # ------------------------------------------------------------------------
    - order: 11
      slug: feature_request_what
      type: free_text
      prompt:
        en: "What feature do you wish WIT had?"
      placeholder:
        en: "Describe the feature in your own words. Doesn't have to be polished."
      min_length: 0
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "feature_request"
      result_hidden: true

    - order: 12
      slug: feature_request_why
      type: free_text
      prompt:
        en: "What problem would this solve, or what would it let you do?"
      placeholder:
        en: "What you're hoping it would help with."
      min_length: 0
      required: false
      conditional_display:
        depends_on: anytime_category
        show_when_value: "feature_request"
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 7 — Other
    # ------------------------------------------------------------------------
    # Friend-experience category was removed: every meaningful friend-related
    # observation routes naturally through bug_report, feature_feedback, or
    # this Other bucket. The forced "is this a friend thing?" choice created
    # mutually-exclusive labeling that researchers can't reliably analyze.
    - order: 13
      slug: other_text
      type: free_text
      prompt:
        en: "What's on your mind?"
      placeholder:
        en: "Anything that didn't fit the other categories."
      min_length: 0
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "other"
      result_hidden: true

    # ------------------------------------------------------------------------
    # FOLLOW-UP CONTACT (universal across categories)
    # ------------------------------------------------------------------------
    - order: 17
      slug: anytime_followup_ok
      type: single_choice
      prompt:
        en: "Can we follow up with you about this submission if needed?"
      options:
        - { order: 1, value: "yes",  label: { en: "Yes, feel free" } }
        - { order: 2, value: "no",   label: { en: "No, just leave this here" } }
      result_hidden: true
