# ============================================================================
# SURVEY — week4_reflection (Days 22–28)
# ============================================================================
- slug: week4_reflection
  type: likert_5
  title:
    en: "Looking back: Week 4"
  description:
    en: "A short reflection on your final week with WIT. Many of you will also be filling out the post-study survey this week — these complement each other."
  interpretation:
    en: "Tomorrow's digest will show how the final week landed across the cohort."
  friend_visible: false
  results_hidden: false
  tokens:
    week_label: "Week 4"
    week_label_lower: "week 4"
    week_number: 4

  questions: *weekly_questions


# ============================================================================
# SURVEY — anytime_reflection (full 28-day window, repeatable)
# ============================================================================
# Opt-in feedback channel. Users can submit as many times as they want
# throughout the study, each submission tagged by category.
#
# Categories: mission suggestion, question/survey suggestion, bug report,
# feature feedback, feature request, friend-experience note, other.
#
# Friend visibility: OFF
# Results: HIDDEN (private feedback, not for digests)

- slug: anytime_reflection
  type: single_choice
  title:
    en: "Drop us a note"
  description:
    en: "Got something to share that doesn't fit the other surveys? Bug, idea, mission suggestion, question for the cohort, weird thing that happened — submit as many times as you want throughout the study."
  interpretation:
    en: ""
  friend_visible: false
  results_hidden: true
  repeatable: true

  questions:

    - order: 1
      slug: anytime_intro
      type: display_only
      content:
        en: "**Quick note: this isn't a long survey.** Pick a category below and answer one or two short questions. You can come back and submit again whenever you have something else to share."

    - order: 2
      slug: anytime_category
      type: single_choice
      prompt:
        en: "What kind of feedback is this?"
      options:
        - { order: 1, value: "mission_suggest",
            label: { en: "💡 Suggest a mission of the day" } }
        - { order: 2, value: "question_suggest",
            label: { en: "❓ Suggest a daily question or survey of the day" } }
        - { order: 3, value: "bug_report",
            label: { en: "🐛 Report a bug or technical issue" } }
        - { order: 4, value: "feature_feedback",
            label: { en: "💬 Share feedback on an existing feature" } }
        - { order: 5, value: "feature_request",
            label: { en: "🔮 Suggest a feature we don't have" } }
        - { order: 6, value: "friend_experience",
            label: { en: "🤝 Share something about your experience with friends on WIT" } }
        - { order: 7, value: "other",
            label: { en: "✏️ Something else" } }
      required: true
      result_kind: option_counts
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 1 — Mission of the day suggestion
    # ------------------------------------------------------------------------
    - order: 3
      slug: mission_suggestion_text
      type: free_text
      prompt:
        en: "What mission would you like us to add? Write it the way you'd want it to appear on the app."
      placeholder:
        en: "e.g., 'Send a song that reminded you of someone today,' or 'Take a photo of something blue you noticed.'"
      min_length: 15
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "mission_suggest"
      result_hidden: true

    - order: 4
      slug: mission_suggestion_why
      type: free_text
      prompt:
        en: "Why this mission? (Optional)"
      min_length: 0
      required: false
      conditional_display:
        depends_on: anytime_category
        show_when_value: "mission_suggest"
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 2 — Daily question / survey of the day suggestion
    # ------------------------------------------------------------------------
    - order: 5
      slug: question_suggestion_type
      type: single_choice
      prompt:
        en: "Which one are you suggesting?"
      options:
        - { order: 1, value: "daily_question",
            label: { en: "Daily question (something to answer about yourself)" } }
        - { order: 2, value: "survey_of_day",
            label: { en: "Survey of the day (something with structured options + digest)" } }
        - { order: 3, value: "either",
            label: { en: "Either could work" } }
      conditional_display:
        depends_on: anytime_category
        show_when_value: "question_suggest"
      result_hidden: true

    - order: 6
      slug: question_suggestion_text
      type: free_text
      prompt:
        en: "What's the question? Write it the way you'd want it to appear."
      placeholder:
        en: "e.g., 'What's something small that made you feel seen this week?' or 'Which part of your routine actually works for you?'"
      min_length: 10
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "question_suggest"
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 3 — Bug report
    # ------------------------------------------------------------------------
    - order: 7
      slug: bug_what_happened
      type: free_text
      prompt:
        en: "What happened? Walk us through it."
      placeholder:
        en: "What you tried to do, what happened instead, what part of the app it was in. The more specific the better."
      min_length: 30
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "bug_report"
      result_hidden: true

    - order: 8
      slug: bug_severity
      type: single_choice
      prompt:
        en: "How disruptive was it?"
      options:
        - { order: 1, value: "minor",     label: { en: "Minor — annoying but I worked around it" } }
        - { order: 2, value: "moderate",  label: { en: "Moderate — it got in the way" } }
        - { order: 3, value: "major",     label: { en: "Major — I couldn't do what I was trying to do" } }
        - { order: 4, value: "blocker",   label: { en: "Total blocker — the app was unusable" } }
      conditional_display:
        depends_on: anytime_category
        show_when_value: "bug_report"
      result_hidden: true

    - order: 9
      slug: bug_reproducible
      type: single_choice
      prompt:
        en: "Can you reproduce it?"
      options:
        - { order: 1, value: "every_time",   label: { en: "Every time I try" } }
        - { order: 2, value: "sometimes",    label: { en: "Sometimes" } }
        - { order: 3, value: "once",         label: { en: "It only happened once" } }
        - { order: 4, value: "unsure",       label: { en: "Not sure" } }
      conditional_display:
        depends_on: anytime_category
        show_when_value: "bug_report"
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 4 — Feature feedback
    # ------------------------------------------------------------------------
    - order: 10
      slug: feature_feedback_which
      type: single_choice
      prompt:
        en: "Which feature is this about?"
      options:
        - { order: 1, value: "daily_questions",       label: { en: "Daily questions" } }
        - { order: 2, value: "question_sending",      label: { en: "Question sending" } }
        - { order: 3, value: "mission_of_day",        label: { en: "Mission of the day" } }
        - { order: 4, value: "survey_of_day",         label: { en: "Survey of the day / daily digest" } }
        - { order: 5, value: "check_ins",             label: { en: "Check-ins (mood, status, song, battery)" } }
        - { order: 6, value: "private_comments",      label: { en: "Private comments" } }
        - { order: 7, value: "emoji_reactions",       label: { en: "Emoji reactions" } }
        - { order: 8, value: "browsing_modes",        label: { en: "Browsing modes (quiet/social)" } }
        - { order: 9, value: "close_friend_filter",   label: { en: "Close-friend filter" } }
        - { order: 10, value: "profile_decoration",   label: { en: "Profile chips, pinned check-ins, persona" } }
        - { order: 11, value: "discover_feed",        label: { en: "Discover feed" } }
        - { order: 12, value: "view_as",              label: { en: "View as / privacy controls" } }
        - { order: 13, value: "shared_playlist",      label: { en: "Shared playlist" } }
        - { order: 14, value: "widget",               label: { en: "Widget" } }
        - { order: 15, value: "other",                label: { en: "Other (specify in next field)" } }
      conditional_display:
        depends_on: anytime_category
        show_when_value: "feature_feedback"
      result_hidden: true

    - order: 11
      slug: feature_feedback_text
      type: free_text
      prompt:
        en: "What's your feedback on this feature? Both 'this works great' and 'this is frustrating' are useful."
      placeholder:
        en: "What works, what doesn't, what you wish were different."
      min_length: 20
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "feature_feedback"
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 5 — Feature request
    # ------------------------------------------------------------------------
    - order: 12
      slug: feature_request_what
      type: free_text
      prompt:
        en: "What feature do you wish WIT had?"
      placeholder:
        en: "Describe the feature in your own words. Doesn't have to be polished."
      min_length: 20
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "feature_request"
      result_hidden: true

    - order: 13
      slug: feature_request_why
      type: free_text
      prompt:
        en: "What problem would this solve, or what would it let you do?"
      placeholder:
        en: "What you're hoping it would help with."
      min_length: 0
      required: false
      conditional_display:
        depends_on: anytime_category
        show_when_value: "feature_request"
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 6 — Friend experience note
    # ------------------------------------------------------------------------
    - order: 14
      slug: friend_experience_text
      type: free_text
      prompt:
        en: "Tell us about something that happened with a friend on WIT — a moment, a feeling, an interaction that stood out."
      placeholder:
        en: "Specific is more useful than general. We won't share usernames with anyone."
      min_length: 30
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "friend_experience"
      result_hidden: true

    - order: 15
      slug: friend_experience_tone
      type: single_choice
      prompt:
        en: "How did this experience leave you feeling?"
      options:
        - { order: 1, value: "good",        label: { en: "Good — happy to share it" } }
        - { order: 2, value: "complicated", label: { en: "Complicated / mixed" } }
        - { order: 3, value: "bad",         label: { en: "Bad — wanted to flag it" } }
        - { order: 4, value: "neutral",     label: { en: "Neutral — just an observation" } }
      conditional_display:
        depends_on: anytime_category
        show_when_value: "friend_experience"
      result_hidden: true

    # ------------------------------------------------------------------------
    # CATEGORY 7 — Other
    # ------------------------------------------------------------------------
    - order: 16
      slug: other_text
      type: free_text
      prompt:
        en: "What's on your mind?"
      placeholder:
        en: "Anything that didn't fit the other categories."
      min_length: 20
      required: true
      conditional_display:
        depends_on: anytime_category
        show_when_value: "other"
      result_hidden: true

    # ------------------------------------------------------------------------
    # FOLLOW-UP CONTACT (universal across categories)
    # ------------------------------------------------------------------------
    - order: 17
      slug: anytime_followup_ok
      type: single_choice
      prompt:
        en: "Can we follow up with you about this submission if needed?"
      options:
        - { order: 1, value: "yes",  label: { en: "Yes, feel free" } }
        - { order: 2, value: "no",   label: { en: "No, just leave this here" } }
      result_hidden: true