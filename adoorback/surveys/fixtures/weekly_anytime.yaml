# ============================================================================
# WEEKLY REFLECTIONS (week1–week4) + ANYTIME REFLECTION
# ============================================================================
# Five surveys total:
#   week1_reflection    — Days 1–7 window  (May 4 – May 10)
#   week2_reflection    — Days 8–14 window (May 11 – May 17)
#   week3_reflection    — Days 15–21 window (May 18 – May 24)
#   week4_reflection    — Days 22–28 window (May 25 – May 31)
#   anytime_reflection  — Full 28-day window, opt-in, repeatable
#
# All five surveys:
#   - friend_visible: false
#   - results_hidden: false for weekly reflections (digest-friendly aggregates)
#   - results_hidden: true  for anytime_reflection (private feedback channel)
#
# ============================================================================
# IMPLEMENTATION NOTES FOR CLAUDE CODE
# ============================================================================
#
# WEEKLY REFLECTIONS — structure
#   Each week's reflection is the SAME 5-item instrument with a
#   {{week_label}} token that resolves to "Week 1", "Week 2", etc.
#   Items: overall feel rating + ritual highlight pick + free-text moment +
#          tomorrow-question + optional bug/issue flag.
#   Released at end of week's window; stays open through the following week.
#   Each user submits ONCE per week (not repeatable).
#
#   Single item bank used across all 4 surveys via YAML anchors.
#
# ANYTIME REFLECTION — repeatable
#   New survey-level field: `repeatable: true`
#     - When set, the survey can be submitted multiple times by the same
#       user throughout its window.
#     - Each submission produces a new row in the data export, identified
#       by user_id + submission_timestamp.
#     - The UI should present this as a persistent "share feedback" entry
#       point that doesn't disappear after submission, OR as a survey card
#       that re-appears available after each submission.
#
# Conditional category-based follow-ups in anytime_reflection use the
# existing `conditional_display` with `show_when_value` (single value match).
#
# No other new schema features.
# ============================================================================


# ============================================================================
# ANCHOR — shared weekly reflection question bank
# ============================================================================

_weekly_questions: &weekly_questions
  - order: 1
    slug: weekly_intro
    type: display_only
    content:
      en: "**{{week_label}} reflection.** A short check-in on how the past week went on WIT. Five items, ~3 minutes."

  - order: 2
    slug: weekly_overall_feel
    type: likert_5
    prompt:
      en: "Overall, how did your {{week_label_lower}} on WIT feel?"
    options:
      - { order: 1, value: 1, label: { en: "Pretty bad" } }
      - { order: 2, value: 2, label: { en: "Not great" } }
      - { order: 3, value: 3, label: { en: "Mixed / okay" } }
      - { order: 4, value: 4, label: { en: "Pretty good" } }
      - { order: 5, value: 5, label: { en: "Really good" } }
    reverse_scored: false
    result_kind: aggregated_likert
    result_group: "weekly_feel"
    result_hidden: false

  - order: 3
    slug: weekly_ritual_highlight
    type: single_choice
    prompt:
      en: "Which part of WIT this week did you actually look forward to or get the most out of?"
    options:
      - { order: 1, value: "daily_questions",   label: { en: "Daily questions" } }
      - { order: 2, value: "mission_of_day",    label: { en: "Mission of the day" } }
      - { order: 3, value: "survey_of_day",     label: { en: "Survey of the day + digest" } }
      - { order: 4, value: "check_ins",         label: { en: "Check-ins (mood, status, song, battery)" } }
      - { order: 5, value: "daily_digest",      label: { en: "Daily digest of friends' posts" } }
      - { order: 6, value: "private_comments",  label: { en: "Private comments / emoji reactions" } }
      - { order: 7, value: "messaging_friends", label: { en: "Messaging friends" } }
      - { order: 8, value: "browsing_quietly",  label: { en: "Browsing without anyone seeing" } }
      - { order: 9, value: "discover_feed",     label: { en: "Discovering new people" } }
      - { order: 10, value: "none",             label: { en: "Honestly, nothing this week" } }
      - { order: 11, value: "other",            label: { en: "Something else (specify below)" } }
    result_kind: option_counts
    result_group: "weekly_highlight"
    result_hidden: false

  - order: 4
    slug: weekly_ritual_highlight_other
    type: free_text
    prompt:
      en: "What was it?"
    min_length: 0
    required: false
    conditional_display:
      depends_on: weekly_ritual_highlight
      show_when_value: "other"
    result_hidden: true

  - order: 5
    slug: weekly_moment
    type: free_text
    prompt:
      en: "Tell us about one specific moment from the past week on WIT — a conversation, a post, a feature you tried, a friend interaction, anything that's still on your mind."
    placeholder:
      en: "Specific is more useful than general. Even a small moment is fine."
    min_length: 30
    required: true
    result_kind: wordcloud
    result_hidden: true

  - order: 6
    slug: weekly_tomorrow_question
    type: free_text
    prompt:
      en: "If you could ask your friends on WIT one question for tomorrow's daily question, what would it be?"
    placeholder:
      en: "Anything you're genuinely curious about — silly, deep, weird, or specific."
    min_length: 10
    required: false
    result_kind: wordcloud
    result_hidden: false

  - order: 7
    slug: weekly_issue_flag
    type: single_choice
    prompt:
      en: "Did anything not work as you expected this week — a bug, a confusing feature, something that felt broken?"
    options:
      - { order: 1, value: "no",        label: { en: "Nope, nothing notable" } }
      - { order: 2, value: "minor",     label: { en: "Yes, but minor" } }
      - { order: 3, value: "real",      label: { en: "Yes, something real" } }
    result_kind: option_counts
    result_hidden: true

  - order: 8
    slug: weekly_issue_text
    type: free_text
    prompt:
      en: "What happened?"
    min_length: 10
    required: false
    conditional_display:
      depends_on: weekly_issue_flag
      show_when_value_in: ["minor", "real"]
    result_hidden: true


# ============================================================================
# SURVEY — week1_reflection (Days 1–7)
# ============================================================================
- slug: week1_reflection
  type: likert_5
  title:
    en: "Looking back: Week 1"
  description:
    en: "A short reflection on your first week with WIT. Released today; stays open through next week."
  interpretation:
    en: "Tomorrow's digest will show how the cohort experienced the first week — favorite features, common moments, and what people are curious to ask each other."
  friend_visible: false
  results_hidden: false
  tokens:
    week_label: "Week 1"
    week_label_lower: "week 1"
    week_number: 1

  questions: *weekly_questions


# ============================================================================
