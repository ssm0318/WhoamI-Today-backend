# ============================================================================
# STUDY ENDPOINT SURVEY (study_endpoint)
# ============================================================================
# Cadence: endpoint
# Window: opens day 28 (May 31), no upper bound
# Friend visibility: OFF
# Results page: HIDDEN (this survey captures account/data fate decisions —
#   not digest-friendly content; users complete it once, individually)
#
# Estimated length: ~12 min
#
# Block summary:
#   §1 Cadence preferences (5 sub-blocks for Ver.W's main rhythms)
#   §2 Data going forward
#   §3 Keep account decision
#   §4 Friend graph fate
#   §5 Profile carryover (chips, pinned check-ins, persona)
#   §6 Final goodbye / open feedback
#
# Note: This survey is served to ALL users regardless of which version they
# experienced. Cadence questions reference Ver.W features because Ver.W is
# what's being kept post-study. Users who only experienced Ver.Q during the
# study can still answer cadence questions hypothetically, since Ver.W will
# be the only version available going forward.
#
# ============================================================================
# IMPLEMENTATION NOTES FOR CLAUDE CODE
# ============================================================================
#
# No new schema features beyond what prior batches introduced.
#
# Cadence sub-blocks: each rhythm (daily questions, mission of day, survey
# of day, daily digest, general WIT check-in) follows the same 3-item
# structure: preferred frequency + satisfaction with that frequency +
# free-text reason. The reason items use min_length: 0 to keep them fully
# optional (people often don't have a reason and shouldn't be forced).
#
# Conditional logic: if user picks "delete account" in §3, the friend graph
# question (§4) is shown but profile carryover (§5) is suppressed (deleting
# the account moots the profile decision). Implementation via existing
# conditional_display.
# ============================================================================


- slug: study_endpoint
  type: single_choice
  title:
    en: "What happens next with WIT"
  description:
    en: "A few questions about how you'd want WIT to fit into your life going forward — or whether it should at all. About 12 minutes."
  interpretation:
    en: ""
  friend_visible: false
  results_hidden: true
  # Highest priority — surfaces first in the index, ahead of editable
  # endpoint surveys (priority 100). One-shot: not editable, not repeatable.
  priority: 200

  questions:

    # ========================================================================
    # §1 — CADENCE PREFERENCES
    # ========================================================================

    - order: 1
      slug: cadence_block_intro
      type: display_only
      content:
        en: "**Part 1: Rhythms.** Several things on WIT happen on a daily rhythm — daily questions, the mission of the day, survey of the day, the daily digest. How would you actually want these to show up?"

    # ------------------------------------------------------------------------
    # §1.1 — Daily questions cadence
    # ------------------------------------------------------------------------
    - order: 2
      slug: cadence_dailyq_freq
      type: single_choice
      prompt:
        en: "**Daily questions** — how often would feel right for you to receive a daily question prompt?"
      options:
        - { order: 1, value: "never",                label: { en: "Never" } }
        - { order: 2, value: "less_than_weekly",     label: { en: "Less than once a week" } }
        - { order: 3, value: "about_weekly",         label: { en: "About once a week" } }
        - { order: 4, value: "every_few_days",       label: { en: "Every few days" } }
        - { order: 5, value: "about_daily",          label: { en: "About once a day" } }
        - { order: 6, value: "multiple_daily",       label: { en: "Multiple times a day" } }
      result_hidden: true

    - order: 3
      slug: cadence_dailyq_satisfaction
      type: likert_5
      prompt:
        en: "How satisfied would you be with that rhythm?"
      options:
        - { order: 1, value: 1, label: { en: "Very dissatisfied" } }
        - { order: 2, value: 2, label: { en: "Somewhat dissatisfied" } }
        - { order: 3, value: 3, label: { en: "Neither dissatisfied nor satisfied" } }
        - { order: 4, value: 4, label: { en: "Somewhat satisfied" } }
        - { order: 5, value: 5, label: { en: "Very satisfied" } }
      result_hidden: true

    - order: 4
      slug: cadence_dailyq_reason
      type: free_text
      prompt:
        en: "Briefly — why that rhythm for daily questions?"
      placeholder:
        en: "Could be a sentence or just a few words."
      min_length: 0
      required: false
      result_hidden: true

    # ------------------------------------------------------------------------
    # §1.2 — Mission of the Day cadence
    # ------------------------------------------------------------------------
    - order: 5
      slug: cadence_mission_freq
      type: single_choice
      prompt:
        en: "**Mission of the day** — how often would feel right for you to see a daily mission?"
      options:
        - { order: 1, value: "never",            label: { en: "Never" } }
        - { order: 2, value: "less_than_weekly", label: { en: "Less than once a week" } }
        - { order: 3, value: "about_weekly",     label: { en: "About once a week" } }
        - { order: 4, value: "every_few_days",   label: { en: "Every few days" } }
        - { order: 5, value: "about_daily",      label: { en: "About once a day" } }
        - { order: 6, value: "multiple_daily",   label: { en: "Multiple times a day" } }
      result_hidden: true

    - order: 6
      slug: cadence_mission_satisfaction
      type: likert_5
      prompt:
        en: "How satisfied would you be with that rhythm?"
      options:
        - { order: 1, value: 1, label: { en: "Very dissatisfied" } }
        - { order: 2, value: 2, label: { en: "Somewhat dissatisfied" } }
        - { order: 3, value: 3, label: { en: "Neither dissatisfied nor satisfied" } }
        - { order: 4, value: 4, label: { en: "Somewhat satisfied" } }
        - { order: 5, value: 5, label: { en: "Very satisfied" } }
      result_hidden: true

    - order: 7
      slug: cadence_mission_reason
      type: free_text
      prompt:
        en: "Briefly — why that rhythm for missions?"
      min_length: 0
      required: false
      result_hidden: true

    # ------------------------------------------------------------------------
    # §1.3 — Survey of the Day cadence
    # ------------------------------------------------------------------------
    - order: 8
      slug: cadence_sotd_freq
      type: single_choice
      prompt:
        en: "**Survey of the day** — how often would feel right for you to see a daily survey question (with a digest the next day)?"
      options:
        - { order: 1, value: "never",            label: { en: "Never" } }
        - { order: 2, value: "less_than_weekly", label: { en: "Less than once a week" } }
        - { order: 3, value: "about_weekly",     label: { en: "About once a week" } }
        - { order: 4, value: "every_few_days",   label: { en: "Every few days" } }
        - { order: 5, value: "about_daily",      label: { en: "About once a day" } }
        - { order: 6, value: "multiple_daily",   label: { en: "Multiple times a day" } }
      result_hidden: true

    - order: 9
      slug: cadence_sotd_satisfaction
      type: likert_5
      prompt:
        en: "How satisfied would you be with that rhythm?"
      options:
        - { order: 1, value: 1, label: { en: "Very dissatisfied" } }
        - { order: 2, value: 2, label: { en: "Somewhat dissatisfied" } }
        - { order: 3, value: 3, label: { en: "Neither dissatisfied nor satisfied" } }
        - { order: 4, value: 4, label: { en: "Somewhat satisfied" } }
        - { order: 5, value: 5, label: { en: "Very satisfied" } }
      result_hidden: true

    - order: 10
      slug: cadence_sotd_reason
      type: free_text
      prompt:
        en: "Briefly — why that rhythm for survey of the day?"
      min_length: 0
      required: false
      result_hidden: true

    # ------------------------------------------------------------------------
    # §1.4 — Daily digest cadence
    # ------------------------------------------------------------------------
    - order: 11
      slug: cadence_digest_freq
      type: single_choice
      prompt:
        en: "**Daily digest** — how often would feel right for you to see the daily digest (yesterday's posts in one place)?"
      options:
        - { order: 1, value: "never",            label: { en: "Never" } }
        - { order: 2, value: "less_than_weekly", label: { en: "Less than once a week" } }
        - { order: 3, value: "about_weekly",     label: { en: "About once a week" } }
        - { order: 4, value: "every_few_days",   label: { en: "Every few days" } }
        - { order: 5, value: "about_daily",      label: { en: "About once a day" } }
        - { order: 6, value: "multiple_daily",   label: { en: "Multiple times a day" } }
      result_hidden: true

    - order: 12
      slug: cadence_digest_satisfaction
      type: likert_5
      prompt:
        en: "How satisfied would you be with that rhythm?"
      options:
        - { order: 1, value: 1, label: { en: "Very dissatisfied" } }
        - { order: 2, value: 2, label: { en: "Somewhat dissatisfied" } }
        - { order: 3, value: 3, label: { en: "Neither dissatisfied nor satisfied" } }
        - { order: 4, value: 4, label: { en: "Somewhat satisfied" } }
        - { order: 5, value: 5, label: { en: "Very satisfied" } }
      result_hidden: true

    - order: 13
      slug: cadence_digest_reason
      type: free_text
      prompt:
        en: "Briefly — why that rhythm for the daily digest?"
      min_length: 0
      required: false
      result_hidden: true

    # ------------------------------------------------------------------------
    # §1.5 — General WIT check-in cadence
    # ------------------------------------------------------------------------
    - order: 14
      slug: cadence_general_freq
      type: single_choice
      prompt:
        en: "**Overall** — how often would feel natural to actually open WIT and check in?"
      options:
        - { order: 1, value: "never",            label: { en: "Never — I'd stop using it" } }
        - { order: 2, value: "less_than_weekly", label: { en: "Less than once a week" } }
        - { order: 3, value: "about_weekly",     label: { en: "About once a week" } }
        - { order: 4, value: "every_few_days",   label: { en: "Every few days" } }
        - { order: 5, value: "about_daily",      label: { en: "About once a day" } }
        - { order: 6, value: "multiple_daily",   label: { en: "Multiple times a day" } }
      result_hidden: true

    - order: 15
      slug: cadence_general_satisfaction
      type: likert_5
      prompt:
        en: "How satisfied would you be with that rhythm?"
      options:
        - { order: 1, value: 1, label: { en: "Very dissatisfied" } }
        - { order: 2, value: 2, label: { en: "Somewhat dissatisfied" } }
        - { order: 3, value: 3, label: { en: "Neither dissatisfied nor satisfied" } }
        - { order: 4, value: 4, label: { en: "Somewhat satisfied" } }
        - { order: 5, value: 5, label: { en: "Very satisfied" } }
      result_hidden: true

    - order: 16
      slug: cadence_general_reason
      type: free_text
      prompt:
        en: "Briefly — why that overall rhythm?"
      min_length: 0
      required: false
      result_hidden: true

    # ========================================================================
    # §2 — DATA GOING FORWARD
    # ========================================================================

    - order: 17
      slug: data_block_intro
      type: display_only
      content:
        en: "**Part 2: Your data going forward.** How would you like us to handle your data?"

    - order: 18
      slug: data_use
      type: single_choice
      prompt:
        en: "If you continue using WIT, how would you like us to handle your data going forward?"
      options:
        - { order: 1, value: "anonymized_aggregated",
            label: { en: "I'm okay with you continuing to use anonymized, aggregated data — no individual data or personal content, just group-level behavior" } }
        - { order: 2, value: "no_use",
            label: { en: "I do not want my data used in any way" } }
        - { order: 3, value: "stopping_use",
            label: { en: "I won't be using WIT anymore, so this doesn't apply to me" } }
        - { order: 4, value: "other",
            label: { en: "Other (specify below)" } }
      result_hidden: true

    - order: 19
      slug: data_use_other_text
      type: free_text
      prompt:
        en: "Could you specify?"
      min_length: 0
      required: false
      conditional_display:
        depends_on: data_use
        show_when_value: "other"
      result_hidden: true

    # ========================================================================
    # §3 — KEEP ACCOUNT DECISION
    # ========================================================================

    - order: 20
      slug: keep_block_intro
      type: display_only
      content:
        en: "**Part 3: Your account.** Going forward, we'll be keeping the **Ver.W** version of WIT (the one with check-ins, mission of the day, daily digest). Ver.Q won't continue.\n\nPlease decide based on whether you'd actually want this in your life."

    - order: 21
      slug: keep_account
      type: single_choice
      prompt:
        en: "Would you like to keep your WIT account and continue using Ver.W?"
      options:
        - { order: 1, value: "keep",
            label: { en: "Yes, I'd like to keep using WIT (Ver.W)" } }
        - { order: 2, value: "delete",
            label: { en: "No, I'd prefer to stop using it and delete my account" } }
        - { order: 3, value: "unsure",
            label: { en: "I'm not sure yet" } }
        - { order: 4, value: "other",
            label: { en: "Other (specify below)" } }
      result_hidden: true

    - order: 22
      slug: keep_account_reason
      type: free_text
      prompt:
        en: "Could you briefly explain your reason — and if you chose to keep your account, what changes (if any) would make Ver.W feel more satisfying to keep using?"
      placeholder:
        en: "A few sentences is plenty."
      min_length: 0
      required: true
      result_hidden: true

    # ========================================================================
    # §4 — FRIEND GRAPH FATE
    # ========================================================================

    - order: 23
      slug: friend_graph_block_intro
      type: display_only
      content:
        en: "**Part 4: Your connections.** How would you like your WIT connections to carry over?"

    - order: 24
      slug: friend_graph_decision
      type: single_choice
      prompt:
        en: "What would you like to happen with your friend connections on WIT?"
      options:
        - { order: 1, value: "keep_all",
            label: { en: "Keep all my current connections as they are" } }
        - { order: 2, value: "keep_close_only",
            label: { en: "Keep only my close friends; drop the rest" } }
        - { order: 3, value: "reset",
            label: { en: "Reset my friend list and start fresh" } }
        - { order: 4, value: "delete_account",
            label: { en: "I'm deleting my account, so this is moot" } }
        - { order: 5, value: "other",
            label: { en: "Other (specify below)" } }
      result_hidden: true

    - order: 25
      slug: friend_graph_other_text
      type: free_text
      prompt:
        en: "Could you specify?"
      min_length: 0
      required: false
      conditional_display:
        depends_on: friend_graph_decision
        show_when_value: "other"
      result_hidden: true

    # ========================================================================
    # §5 — PROFILE CARRYOVER (Ver.W users)
    # Suppressed if user is deleting account.
    # ========================================================================

    - order: 26
      slug: profile_block_intro
      type: display_only
      content:
        en: "**Part 5: Your profile.** How would you like your profile setup to carry over?"
      conditional_display:
        depends_on: keep_account
        show_when_value_not: "delete"

    - order: 27
      slug: profile_carryover
      type: single_choice
      prompt:
        en: "What would you like to happen with your current profile setup (chips, pinned check-ins, persona)?"
      options:
        - { order: 1, value: "keep_all",
            label: { en: "Keep my profile as-is" } }
        - { order: 2, value: "minor_edits",
            label: { en: "Keep most of it but I'll edit a few things later" } }
        - { order: 3, value: "fresh_start",
            label: { en: "Reset and start fresh on my profile" } }
        - { order: 4, value: "didnt_setup",
            label: { en: "I didn't really set this up, so it doesn't matter" } }
        - { order: 5, value: "other",
            label: { en: "Other (specify below)" } }
      conditional_display:
        depends_on: keep_account
        show_when_value_not: "delete"
      result_hidden: true

    - order: 28
      slug: profile_carryover_other_text
      type: free_text
      prompt:
        en: "Could you specify?"
      min_length: 0
      required: false
      conditional_display:
        depends_on: profile_carryover
        show_when_value: "other"
      result_hidden: true

    # ========================================================================
    # §6 — FINAL GOODBYE
    # ========================================================================

    - order: 29
      slug: goodbye_block_intro
      type: display_only
      content:
        en: "**Last part.** Anything you want us to know — about WIT, social media in general, or this experience — as you wrap up?"

    - order: 30
      slug: final_thoughts
      type: free_text
      prompt:
        en: "Anything we should know as you leave or continue with WIT?"
      placeholder:
        en: "Could be a thank-you, a complaint, a hope, an idea, a story — whatever's on your mind. Take as much space as you want."
      min_length: 0
      required: false
      result_hidden: true

    - order: 31
      slug: future_contact
      type: single_choice
      prompt:
        en: "Could we contact you in the future about WIT updates or follow-up opportunities?"
      options:
        - { order: 1, value: "yes_anything",
            label: { en: "Yes, anything related to WIT" } }
        - { order: 2, value: "yes_specific",
            label: { en: "Yes, but only for follow-up questions" } }
        - { order: 3, value: "yes_product",
            label: { en: "Yes, but only for product updates if I keep my account" } }
        - { order: 4, value: "no",
            label: { en: "No thanks" } }
      result_hidden: true
