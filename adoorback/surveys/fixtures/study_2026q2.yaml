# WhoamI Today — 4-week study (May 2 – May 30, 2026) survey content.
# Loaded via: python manage.py load_surveys adoorback/surveys/fixtures/study_2026q2.yaml
# Required slugs (per whoami-today-survey-scheduling.md):
#   daily_base, pre_study, mid_study, post_study,
#   week1_reflection, week2_reflection, week3_reflection, week4_reflection,
#   anytime_reflection, study_endpoint
#   (optional) dayN_special — only when SPECIAL_DAILY_DAYS in the seed migration is non-empty
#
# Re-run load_surveys after editing — it's idempotent on slug (update_or_create)
# and overwrites questions/options for existing slugs when --replace-questions
# is passed.

- slug: pre_study
  type: likert_5
  title:
    en: "Pre-study survey"
    ko: "사전 설문"
  description:
    en: "Welcome! A few quick questions before we start. Your responses stay private — we don't share aggregate results back during the study so they don't influence later answers."
    ko: "환영합니다! 시작하기 전에 짧은 질문 몇 가지 드릴게요. 응답은 비공개이며, 이후 답변에 영향을 주지 않도록 연구 기간 중에는 다른 참가자들의 응답 결과를 공유하지 않습니다."
  friend_visible: false
  # Research instrument — baseline measurement. Aggregates would anchor
  # mid_study / post_study responses, so results stay hidden for the
  # duration of the study.
  results_hidden: true
  questions:
    - order: 1
      prompt:
        en: "How excited are you to start using WhoamI Today?"
        ko: "WhoamI Today를 시작하는 것에 얼마나 기대되나요?"
      low_label: { en: "Not at all", ko: "전혀" }
      high_label: { en: "Very excited", ko: "매우 기대됨" }
      reverse_scored: false
      result_kind: aggregated_likert
      result_group: excitement
    - order: 2
      prompt:
        en: "How are you feeling today?"
        ko: "오늘 기분이 어떤가요?"
      low_label: { en: "Very low", ko: "매우 낮음" }
      high_label: { en: "Very high", ko: "매우 높음" }
      reverse_scored: false
      result_kind: aggregated_likert
      result_group: mood
    - order: 3
      type: free_text
      prompt:
        en: "What do you hope to get out of the next four weeks?"
        ko: "다음 4주 동안 무엇을 얻고 싶으신가요?"
      result_kind: wordcloud

