- slug: daily_base
  type: likert_5
  title:
    en: "Daily check-in"
    ko: "일일 체크인"
  description:
    en: "A quick daily pulse. Tomorrow we'll show how your friends and the WhoamI Today community are feeling today, plus how you compare. Friend-level results unlock with 5+ close connections."
    ko: "오늘의 빠른 체크인이에요. 내일은 친구들과 WhoamI Today 커뮤니티가 오늘 어떻게 느끼는지, 그리고 본인은 어떤지 보여드릴게요. 친구 단위 결과는 가까운 친구가 5명 이상일 때 공개됩니다."
  friend_visible: true
  results_hidden: false
  questions:
    - order: 1
      prompt:
        en: "How are you feeling right now?"
        ko: "지금 기분이 어떠세요?"
      low_label: { en: "Very low", ko: "매우 낮음" }
      high_label: { en: "Very high", ko: "매우 높음" }
      reverse_scored: false
      result_kind: aggregated_likert
      result_group: mood

- slug: mid_study
  type: likert_5
  title:
    en: "Mid-study reflection"
    ko: "중간 회고"
  description:
    en: "We're halfway through. A few minutes to reflect on how it's going — your responses stay private."
    ko: "절반쯤 왔어요. 잠시 시간을 내어 지금까지의 경험을 돌아봐 주세요. 응답은 비공개입니다."
  friend_visible: false
  results_hidden: true
  questions:
    - order: 1
      prompt:
        en: "How is your experience with WhoamI Today going so far?"
        ko: "지금까지 WhoamI Today 사용 경험은 어떠신가요?"
      low_label: { en: "Not great", ko: "별로예요" }
      high_label: { en: "Great", ko: "아주 좋아요" }
      reverse_scored: false
      result_kind: aggregated_likert
      result_group: experience
    - order: 2
      prompt:
        en: "Has using WhoamI Today changed how you connect with your friends?"
        ko: "WhoamI Today 사용이 친구들과의 연결 방식에 영향을 주었나요?"
      low_label: { en: "Not at all", ko: "전혀" }
      high_label: { en: "Quite a lot", ko: "매우 많이" }
      reverse_scored: false
      result_kind: aggregated_likert
      result_group: connection
    - order: 3
      type: free_text
      prompt:
        en: "What's working well for you, and what would you change?"
        ko: "지금까지 잘 맞는 점, 그리고 바꾸고 싶은 점이 있다면요?"
      result_kind: wordcloud

