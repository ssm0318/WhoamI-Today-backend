# ============================================================================
# END-OF-PHASE PER-FRIEND CLOSENESS RE-EVALUATION (2 surveys, 1 file)
# ============================================================================
# Surveys produced by this file:
#   1. phase1_friend_closeness  — Day 15 (May 18), end of Phase 1
#   2. phase2_friend_closeness  — Day 28 (May 31), end of Phase 2
#
# Each survey re-asks the closeness rating originally collected via
# FriendEvaluation (when the user added each friend) but now scoped to the
# end of a study phase. Joining SurveyAnswer × FriendEvaluation at analysis
# time gives a longitudinal per-friend delta:
#   baseline (FriendEvaluation.closeness, written at friend-request time)
#   → phase1_friend_closeness (Day 15)
#   → phase2_friend_closeness (Day 28)
#
# Each survey has the SAME structure, differing only in slug, title copy,
# and per-question slugs. Both surveys:
#   - friend_visible: false       (private research data)
#   - results_hidden: true        (no aggregate result panel)
#   - allow_late: true (set on the ScheduledSurvey row)
#   - priority: 100               (high-priority end-of-phase survey)
#
# Per-friend types: see surveys/models.py PER_FRIEND_TYPES. At render time
# the API expands each per_friend_* question into one virtual question per
# friend the viewer currently has. Each virtual question carries:
#   target_user_id, target_user_username, baseline_closeness,
#   baseline_relationship_type
# alongside the normal question fields, plus {{friend_name}},
# {{baseline_closeness}}, {{baseline_relationship_type}} resolved in any
# text field at expansion time.
# ============================================================================

- slug: phase1_friend_closeness
  type: per_friend_likert_5
  title:
    en: "Rate your closeness with each friend (Phase 1)"
    ko: "친구별 친밀감 평가 (Phase 1)"
  description:
    en: "When you added each friend on WIT, you rated how close you felt to them on a 1–5 scale. Now that Phase 1 is wrapping up, we'd like to hear those ratings again, plus a quick note on how often you interact in person. The whole thing should take a couple of minutes — there's one short card per friend."
    ko: "WIT에서 친구를 추가할 때 1~5점으로 친밀감을 평가하셨어요. Phase 1이 마무리되는 지금, 같은 친구들에 대해 다시 한 번 평가해 주세요. 직접 만나 얼마나 자주 교류하는지도 함께 알려주세요. 친구당 한 장씩, 몇 분이면 끝납니다."
  friend_visible: false
  results_hidden: true
  editable: false
  priority: 100
  point_value: 25
  tokens:
    phase_label: "Phase 1"

  questions:
    - order: 1
      slug: phase1_friend_closeness_intro
      type: display_only
      content:
        en: "One card per friend. For each friend below, rate how close you feel now and how often you interact in person. If we have an earlier rating, you'll see an option to correct it only if it was a genuine mistake. If we don't have one, answer the earlier-rating item only if you can remember it accurately from a specific memory anchor; otherwise choose \"I'm not sure.\" Tap their name to open their profile if you need a refresher on who they are."
        ko: "친구 한 명당 한 장씩 카드가 나옵니다. 지금 얼마나 가까운지와 직접 만나 얼마나 자주 교류하는지를 평가해 주세요. 이전 평가가 있으면 진짜 실수였을 때만 수정할 수 있는 선택지가 보여요. 이전 평가가 없으면 구체적인 기억 근거로 정확히 떠올릴 수 있을 때만 그때의 평가를 답하고, 아니면 \"잘 모르겠어요\"를 선택해 주세요. 이름을 누르면 프로필이 열려요."

    - order: 2
      slug: phase1_friend_closeness_current
      type: per_friend_likert_5
      prompt:
        en: "How close do you feel to {{friend_name}} right now?"
        ko: "지금 {{friend_name}} 님과 얼마나 가깝다고 느끼나요?"
      low_label:  { en: "Not at all close", ko: "전혀 가깝지 않음" }
      high_label: { en: "Extremely close",  ko: "매우 가까움" }
      reverse_scored: false
      required: true
      result_hidden: true

    - order: 3
      slug: phase1_friend_closeness_corrected_baseline
      type: per_friend_likert_5
      prompt:
        en: "What should the earlier rating have been?"
        ko: "그때의 평가는 몇 점이었어야 하나요?"
      low_label:  { en: "Not at all close", ko: "전혀 가깝지 않음" }
      high_label: { en: "Extremely close",  ko: "매우 가까움" }
      reverse_scored: false
      required: false
      result_hidden: true

    - order: 4
      slug: phase1_friend_closeness_offline
      type: per_friend_single_choice
      prompt:
        en: "How often do you usually interact with {{friend_name}} in person?"
        ko: "{{friend_name}} 님과 직접 만나 얼마나 자주 교류하나요?"
      options:
        - { order: 1, value: "never",     label: { en: "Never",                              ko: "전혀 만나지 않음" } }
        - { order: 2, value: "rarely",    label: { en: "Rarely (a few times a year)",        ko: "드물게 (일 년에 몇 번)" } }
        - { order: 3, value: "monthly",   label: { en: "About monthly",                      ko: "한 달에 한 번 정도" } }
        - { order: 4, value: "weekly",    label: { en: "About weekly",                       ko: "일주일에 한 번 정도" } }
        - { order: 5, value: "daily_ish", label: { en: "Daily or almost daily",              ko: "거의 매일" } }
      required: true
      result_hidden: true


