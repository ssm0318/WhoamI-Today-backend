schema_version: 1
purpose: Map final-schema survey questions to deployed/recovery sources for conservative response merging
  and missing-response audits.
merge_rules:
  exact: Same survey construct and final-compatible response schema. Safe to merge automatically.
  compatible: Wording changed slightly, but the same construct and response schema were asked. Safe to
    merge automatically with provenance retained.
  related_only: Useful context for human review, but not a valid substitute for the canonical final-schema
    question.
global_notes:
- Canonical IDs are analysis variables, not participant-facing labels.
- Only sources marked exact or compatible are counted as answered by audit_survey_recovery_coverage.
- Sources marked related_only are reported separately and should not be merged automatically.
- Run audit_survey_recovery_coverage on the production database to determine actual participant coverage.
canonical_questions:
- canonical_id: daily_base.effort
  response_type: likert_5_na
  sources:
  - survey_slug: daily_base
    question_slug: effort
    equivalence: exact
  related_sources:
  - survey_slug: daily_base
    question_slug: ''
    equivalence: related_only
    reason: Legacy deployed daily question was a one-item mood prompt, not this final daily item.
  recovery_policy: not_recoverable_for_past_dates; collect only going forward with the final daily_base
    schema.
