# ============================================================================
# BATCH 4 — SOTD DAYS 1, 24, 25, 26 (Closing surveys)
# ============================================================================
# Surveys in this batch:
#   sotd_d01_honeymoon  — Day-1 first-impressions snapshot
#   sotd_d24_ceii       — CEI-II curiosity (10 items)
#   sotd_d25_iuipc      — IUIPC privacy concern short (10 items)
#   sotd_d26_transition — End-of-study reflection + transition
#
# Calendar mapping:
#   Study day 1  = Mon May 4  (Honeymoon snapshot)
#   Study day 24 = Wed May 27 (CEI-II curiosity)
#   Study day 25 = Thu May 28 (IUIPC privacy)
#   Study day 26 = Fri May 29 (Transition; post_study published same day)
#
# All surveys:
#   - friend_visible: false
#   - results_hidden: false (results shown except for items flagged with
#     result_hidden: true at the question level — i.e., free-text reflection)
#
# Result kinds vary:
#   - sotd_d01: option_counts + wordcloud (no scale score)
#   - sotd_d24: scale_score_histogram (CEI-II is a single-score scale)
#   - sotd_d25: scale_score_histogram (IUIPC short, single score)
#   - sotd_d26: option_counts + wordcloud (reflection, not a scale)
#
# ============================================================================
# IMPLEMENTATION NOTES FOR CLAUDE CODE
# ============================================================================
#
# No new schema features needed. All features used here are introduced in
# prior batches (free_text with min_length, single_choice, multi_choice,
# scale_score_histogram, display_only).
#
# Note on sotd_d26 vs post_study: The day-26 Friday SOTD is a SHORT
# reflection (~5 min). The post_study survey is published on the SAME day
# (Friday May 29) and stays open through Sunday May 31, taking ~17–30 min.
# These are intentionally complementary — d26 captures gut reactions that
# may not survive the longer post_study reflection.
#
# ============================================================================


# ============================================================================
# DAY 1 — HONEYMOON SNAPSHOT (Mon May 4)
# ============================================================================
# Goal: light first-day item that surfaces gut reactions before users develop
# a frame of reference. Friendly digest material for day 2.
# Designed to take ~2 minutes.

- slug: sotd_d01_honeymoon
  type: single_choice
  title:
    en: "First impressions"
  description:
    en: "Welcome to the first day on WIT. A quick check-in on what stuck out — good, weird, surprising, anything."
  interpretation:
    en: "Tomorrow's digest will show what surprised people most about their first day, and which features got the strongest first reactions."
  friend_visible: false
  results_hidden: false

  questions:
    - order: 1
      slug: honeymoon_first_impression
      type: single_choice
      prompt:
        en: "If you had to describe your first day on WIT in one word, which one fits best?"
      options:
        - { order: 1, value: "curious",      label: { en: "Curious" } }
        - { order: 2, value: "fun",          label: { en: "Fun" } }
        - { order: 3, value: "calm",         label: { en: "Calm" } }
        - { order: 4, value: "confused",     label: { en: "Confused" } }
        - { order: 5, value: "awkward",      label: { en: "Awkward" } }
        - { order: 6, value: "refreshing",   label: { en: "Refreshing" } }
        - { order: 7, value: "lonely",       label: { en: "Lonely" } }
        - { order: 8, value: "overwhelmed",  label: { en: "Overwhelmed" } }
        - { order: 9, value: "neutral",      label: { en: "Neutral / haven't formed an impression yet" } }
      result_kind: option_counts

    - order: 2
      slug: honeymoon_compared_to
      type: single_choice
      prompt:
        en: "How does WIT feel compared to other social apps you use?"
      options:
        - { order: 1, value: "very_similar",     label: { en: "Very similar to what I'm used to" } }
        - { order: 2, value: "somewhat_similar", label: { en: "Somewhat similar" } }
        - { order: 3, value: "somewhat_diff",    label: { en: "Somewhat different" } }
        - { order: 4, value: "very_diff",        label: { en: "Very different" } }
        - { order: 5, value: "too_early",        label: { en: "Too early to say" } }
      result_kind: option_counts

    - order: 3
      slug: honeymoon_surprised_by
      type: free_text
      prompt:
        en: "What surprised you about WIT on your first day, if anything?"
      placeholder:
        en: "Could be a feature, a small detail, the look, how it felt — anything."
      min_length: 15
      required: false
      result_kind: wordcloud
      result_hidden: false

    - order: 4
      slug: honeymoon_first_friend_action
      type: single_choice
      prompt:
        en: "Have you connected with at least one friend on WIT yet?"
      options:
        - { order: 1, value: "yes_several", label: { en: "Yes, several" } }
        - { order: 2, value: "yes_one",     label: { en: "Yes, at least one" } }
        - { order: 3, value: "trying",      label: { en: "Trying to but haven't yet" } }
        - { order: 4, value: "not_yet",     label: { en: "Not yet" } }
      result_kind: option_counts


# ============================================================================
# DAY 24 — CEI-II CURIOSITY (Curiosity and Exploration Inventory-II)
# ============================================================================
# Source: Kashdan et al. (2009). 10 items, two subscales (Stretching and
# Embracing) but standard practice scores all 10 as a single total.
# All items positively keyed (no reverse-scoring).
# Higher score = greater general curiosity / exploration tendency.

- slug: sotd_d24_ceii
  type: likert_5
  title:
    en: "How drawn are you to the new and uncertain?"
  description:
    en: "Today's questions are about how you respond to novelty and uncertainty in everyday life — situations where you don't quite know what's coming."
  interpretation:
    en: "Higher scores reflect being drawn to new experiences and comfortable not knowing how things will turn out. Lower scores reflect preferring familiar territory and predictable outcomes. Both are reasonable; high curiosity helps you discover, low curiosity helps you stay grounded."
  friend_visible: false
  results_hidden: false
  result_kind: scale_score_histogram

  questions:
    - order: 1
      slug: ceii_1
      type: likert_5
      prompt:
        en: "I actively seek as much information as I can in new situations."
      low_label:  { en: "Very slightly or not at all" }
      high_label: { en: "Extremely" }
      reverse_scored: false

    - order: 2
      slug: ceii_2
      type: likert_5
      prompt:
        en: "I am the type of person who really enjoys the uncertainty of everyday life."
      low_label:  { en: "Very slightly or not at all" }
      high_label: { en: "Extremely" }
      reverse_scored: false

    - order: 3
      slug: ceii_3
      type: likert_5
      prompt:
        en: "I am at my best when doing something that is complex or challenging."
      low_label:  { en: "Very slightly or not at all" }
      high_label: { en: "Extremely" }
      reverse_scored: false

    - order: 4
      slug: ceii_4
      type: likert_5
      prompt:
        en: "Everywhere I go, I am out looking for new things or experiences."
      low_label:  { en: "Very slightly or not at all" }
      high_label: { en: "Extremely" }
      reverse_scored: false

    - order: 5
      slug: ceii_5
      type: likert_5
      prompt:
        en: "I view challenging situations as an opportunity to grow and learn."
      low_label:  { en: "Very slightly or not at all" }
      high_label: { en: "Extremely" }
      reverse_scored: false

    - order: 6
      slug: ceii_6
      type: likert_5
      prompt:
        en: "I like to do things that are a little frightening."
      low_label:  { en: "Very slightly or not at all" }
      high_label: { en: "Extremely" }
      reverse_scored: false

    - order: 7
      slug: ceii_7
      type: likert_5
      prompt:
        en: "I am always looking for experiences that challenge how I think about myself and the world."
      low_label:  { en: "Very slightly or not at all" }
      high_label: { en: "Extremely" }
      reverse_scored: false

    - order: 8
      slug: ceii_8
      type: likert_5
      prompt:
        en: "I prefer jobs that are excitingly unpredictable."
      low_label:  { en: "Very slightly or not at all" }
      high_label: { en: "Extremely" }
      reverse_scored: false

    - order: 9
      slug: ceii_9
      type: likert_5
      prompt:
        en: "I frequently seek out opportunities to challenge myself and grow as a person."
      low_label:  { en: "Very slightly or not at all" }
