# ============================================================================
# BATCH 2 — SOTD DAYS 12–15
# ============================================================================
# Surveys in this batch:
#   day12_ntb    — Need to Belong (Leary et al., 10 items)
#   day15_shi    — Self-Report Habit Index for nominated platform (12 items)
#   day16_hexaco_hh — HEXACO-60 Honesty-Humility facet (10 items)
#   day17_hexaco_em — HEXACO-60 Emotionality facet (10 items)
#
# Calendar mapping (per the agreed schedule):
#   Study day 12 = Fri May 15 (NTB; mid_study published same day)
#   Study day 15 = Mon May 18 (SHI)
#   Study day 16 = Tue May 19 (HEXACO H-H)
#   Study day 17 = Wed May 20 (HEXACO Emotionality)
#
# All surveys:
#   - friend_visible: false
#   - results_hidden: false
#   - result_kind: scale_score_histogram (one summary score per scale)
#
# ============================================================================
# IMPLEMENTATION NOTES FOR CLAUDE CODE
# ============================================================================
#
# NEW feature for SHI: token substitution from user-level embedded data.
#   - The pre-study `habit_platform` answer is stored as user embedded data.
#   - In day15_shi, item prompts use {{habit_platform_label}} which the
#     scheduler resolves at render time per user (e.g., "Instagram",
#     "TikTok", "Discord").
#   - Token resolution lookup table (built from pre-study response):
#       value             → label
#       "instagram"       → "Instagram"
#       "tiktok"          → "TikTok"
#       "discord"         → "Discord"
#       "reddit"          → "Reddit"
#       "snapchat"        → "Snapchat"
#       "twitter"         → "Twitter / X"
#       "facebook"        → "Facebook"
#       "bereal"          → "BeReal"
#       "threads"         → "Threads"
#       "imessage"        → "iMessage / SMS"
#       "other"           → user's free-text from `habit_platform_other`
#       "none"            → fall back to "social media" (see graceful fallback
#                            note below)
#
# Graceful fallback for SHI:
#   If user picked "none" in pre-study habit_platform, day15_shi should
#   either:
#   (a) Skip serving day15_shi to that user entirely
#   (b) Substitute "social media" as the label and ask in general terms
#   Recommend (a). The slot becomes a free day for that user (no SOTD).
#
# HEXACO scoring:
#   Each HEXACO-60 facet has 10 items with mixed reverse-scoring.
#   Following Ashton & Lee (2009) HEXACO-60 published key.
#
# ============================================================================


# ============================================================================
