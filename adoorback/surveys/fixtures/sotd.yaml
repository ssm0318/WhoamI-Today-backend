# ============================================================================
# DAY 25 — IUIPC SHORT (Internet Users' Information Privacy Concerns)
# ============================================================================
# Source: Malhotra, Kim, & Agarwal (2004). 10-item short form covering three
# subscales (Control, Awareness, Collection). All items positively keyed.
# Higher score = greater privacy concern.

- slug: sotd_d25_iuipc
  type: likert_7
  title:
    en: "How much do you care about online privacy?"
  description:
    en: "Today's questions are about how you generally feel about online services collecting and using your information."
  interpretation:
    en: "Higher scores reflect being more concerned about how online services handle your personal information. Lower scores reflect being more relaxed about it. Both are common positions, and they don't necessarily reflect privacy behavior — people who score lower may still take privacy seriously, and vice versa."
  friend_visible: false
  results_hidden: false
  result_kind: scale_score_histogram

  questions:
    - order: 1
      slug: iuipc_intro
      type: display_only
      content:
        en: "These questions are about online services in general (apps, websites, platforms) — not WIT specifically."

    # CONTROL subscale (3 items)
    - order: 2
      slug: iuipc_control_1
      type: likert_7
      prompt:
        en: "Consumer online privacy is really a matter of consumers' right to exercise control and autonomy over decisions about how their information is collected, used, and shared."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 3
      slug: iuipc_control_2
      type: likert_7
      prompt:
        en: "Consumer control of personal information lies at the heart of consumer privacy."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 4
      slug: iuipc_control_3
      type: likert_7
      prompt:
        en: "I believe that online privacy is invaded when control is lost or unwillingly reduced as a result of a marketing transaction."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    # AWARENESS subscale (3 items)
    - order: 5
      slug: iuipc_awareness_1
      type: likert_7
      prompt:
        en: "Companies seeking information online should disclose the way the data are collected, processed, and used."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 6
      slug: iuipc_awareness_2
      type: likert_7
      prompt:
        en: "A good consumer online privacy policy should have a clear and conspicuous disclosure."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 7
      slug: iuipc_awareness_3
      type: likert_7
      prompt:
        en: "It is very important to me that I am aware and knowledgeable about how my personal information will be used."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    # COLLECTION subscale (4 items)
    - order: 8
      slug: iuipc_collection_1
      type: likert_7
      prompt:
        en: "It usually bothers me when online companies ask me for personal information."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 9
      slug: iuipc_collection_2
      type: likert_7
      prompt:
        en: "When online companies ask me for personal information, I sometimes think twice before providing it."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 10
      slug: iuipc_collection_3
      type: likert_7
      prompt:
        en: "It bothers me to give personal information to so many online companies."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 11
      slug: iuipc_collection_4
      type: likert_7
      prompt:
        en: "I am concerned that online companies are collecting too much personal information about me."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false


# ============================================================================
# DAY 26 — END-OF-STUDY REFLECTION + TRANSITION (Fri May 29)
# ============================================================================
# Goal: short reflection capturing gut reactions BEFORE the longer post_study
# survey (also published this Friday) is completed.
# Designed to take ~5 minutes.

- slug: sotd_d26_transition
  type: single_choice
  title:
    en: "Looking back at the month"
  description:
    en: "You've been on WIT for almost a month now. A few quick reflections — your fuller post-study survey was also just published, and it'll go deeper. This one is just gut reactions."
  interpretation:
    en: "Tomorrow's digest will show how the cohort summarized the month — favorite features, biggest changes, what people thought about social media in general after this experience."
  friend_visible: false
  results_hidden: false

  questions:
    - order: 1
      slug: transition_one_word
      type: single_choice
      prompt:
        en: "If you had to describe your month on WIT in one word, which fits best?"
      options:
        - { order: 1, value: "refreshing",   label: { en: "Refreshing" } }
        - { order: 2, value: "calm",         label: { en: "Calm" } }
        - { order: 3, value: "fun",          label: { en: "Fun" } }
        - { order: 4, value: "lonely",       label: { en: "Lonely" } }
        - { order: 5, value: "awkward",      label: { en: "Awkward" } }
        - { order: 6, value: "boring",       label: { en: "Boring" } }
        - { order: 7, value: "meaningful",   label: { en: "Meaningful" } }
        - { order: 8, value: "frustrating",  label: { en: "Frustrating" } }
        - { order: 9, value: "experimental", label: { en: "Experimental" } }
        - { order: 10, value: "neutral",     label: { en: "Neutral" } }
      result_kind: option_counts

    - order: 2
      slug: transition_first_word_compare
      type: display_only
      content:
        en: "Earlier this month, on day 1, we asked you the same question. Your tomorrow's digest will compare how the cohort's words shifted between day 1 and now."

    - order: 3
      slug: transition_keep_using
      type: single_choice
      prompt:
        en: "If WIT stayed available after this study, would you keep using it?"
      options:
        - { order: 1, value: "definitely_yes", label: { en: "Definitely yes" } }
        - { order: 2, value: "probably_yes",   label: { en: "Probably yes" } }
        - { order: 3, value: "maybe",          label: { en: "Maybe" } }
        - { order: 4, value: "probably_no",    label: { en: "Probably not" } }
        - { order: 5, value: "definitely_no",  label: { en: "Definitely not" } }
      result_kind: option_counts

    - order: 4
      slug: transition_changed_view
      type: single_choice
      prompt:
        en: "Has using WIT changed how you think about social media in general?"
      options:
        - { order: 1, value: "yes_a_lot",      label: { en: "Yes, a lot" } }
        - { order: 2, value: "yes_a_little",   label: { en: "Yes, a little" } }
        - { order: 3, value: "not_really",     label: { en: "Not really" } }
        - { order: 4, value: "no",             label: { en: "No" } }
      result_kind: option_counts

    - order: 5
      slug: transition_changed_view_text
      type: free_text
      prompt:
        en: "If yes — what changed in how you think about social media?"
      placeholder:
        en: "A specific shift, even a small one, is more useful than a general statement."
      min_length: 20
      required: false
      result_kind: wordcloud
      conditional_display:
        depends_on: transition_changed_view
        show_when_value_in: ["yes_a_lot", "yes_a_little"]

    - order: 6
      slug: transition_one_thing_keep
      type: free_text
      prompt:
        en: "If you could keep one thing about WIT and bring it to other apps you use, what would it be?"
      placeholder:
        en: "A feature, a behavior, a vibe — anything."
      min_length: 15
      required: false
      result_kind: wordcloud

    - order: 7
      slug: transition_outro
      type: display_only
      content:
        en: "**Thanks for these gut reactions.** Your full post-study survey is also published today — it'll go deeper into specific features and the goal-by-goal breakdown. Take your time with it; it can stay open through Sunday."