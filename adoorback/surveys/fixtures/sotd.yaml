# ============================================================================
# BATCH 1 — SOTD DAYS 2–9 (Tier-1 Trait Moderators)
# ============================================================================
# Eight surveys, one per study day. Each survey is self-contained: a complete
# subscale that yields one summary score, displayed as a histogram with the
# user's score marked.
#
# Surveys in this batch:
#   sotd_d02_rsds        — Self-disclosure propensity (RSDS-10)
#   day03_iscs_bond   — Bonding social capital (Williams ISCS, 10 items)
#   sotd_d04_iscs_bridge — Bridging social capital (Williams ISCS, 10 items)
#   sotd_d05_rsq         — Rejection sensitivity (RSQ-Brief, 8 situations × 2)
#   sotd_d08_singelis_ind — Self-construal: independent (Singelis SCS, 12 items)
#   sotd_d09_singelis_int — Self-construal: interdependent (Singelis SCS, 12 items)
#   sotd_d10_woodAS      — Authenticity (Wood AS, 12 items)
#   sotd_d11_ucla8       — Loneliness (UCLA-8)
#
# All 8 surveys:
#   - friend_visible: false (private trait data)
#   - results_hidden: false (results shown to participant via summary score
#     histogram with their score marked)
#   - cadence: daily, single-day window matching study day
#
# ============================================================================
# IMPLEMENTATION NOTES FOR CLAUDE CODE
# ============================================================================
#
# NEW result_kind: `scale_score_histogram`
#   - Operates at the SURVEY level, not per-question
#   - Computes a single summary score per submission by summing all
#     `likert_*` items in the survey, applying `reverse_scored: true`
#     transformation where flagged
#   - Renders one panel per survey: a histogram of all participants'
#     total scores, with the current user's score marked by a vertical
#     line / dot
#   - Optional `interpretation` text at survey level explains what
#     higher/lower scores mean
#   - Items with result_hidden: true at the question level are still
#     INCLUDED in score computation but not shown individually anywhere
#
# Survey-level field added: `result_kind: scale_score_histogram`
#   - When present at survey level, individual question result_kind values
#     are ignored on the results page; only the scale-score histogram shows
#   - Per-question result_hidden still controls whether items appear in
#     downstream analyses or admin views
#
# Survey-level field added: `score_components`
#   - Optional. If present, declares which item slugs feed into the score.
#     If absent, all likert_* items in the survey are summed.
#   - Used in sotd_d05_rsq (which has a derivation rule across paired items)
#     and could be used in day03/day04 if you ever bundle multiple ISCS
#     subscales into one survey.
#
# Score interpretation per scale (for `interpretation` field):
#   See each survey's interpretation text below. All summary scores are
#   reported as raw sums (not normed); higher/lower interpretations are
#   in the survey-level interpretation text.
#
# ============================================================================


# ============================================================================
# DAY 2 — RSDS (Self-Disclosure Propensity, 10-item short)
# ============================================================================
# Source: Wheeless Revealer-Concealer Self-Disclosure Scale, short form.
# Items 4 and 8 are reverse-scored.
# Higher score = greater general willingness to self-disclose.

- slug: sotd_d02_rsds
  type: likert_5
  title:
    en: "How openly do you tend to share?"
  description:
    en: "Today's question is about how you generally share things with people in your life — outside of WIT, in any context. There's no right answer."
  interpretation:
    en: "Higher scores mean you tend to share openly and in detail. Lower scores mean you tend to keep things more private. Neither is better — both reflect different ways of relating."
  friend_visible: false
  results_hidden: false
  result_kind: scale_score_histogram

  questions:
    - order: 1
      slug: rsds_1
      type: likert_5
      prompt:
        en: "When I share with others, I usually share for a long time at once."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 2
      slug: rsds_2
      type: likert_5
      prompt:
        en: "My statements about myself are usually quite long."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 3
      slug: rsds_3
      type: likert_5
      prompt:
        en: "Once I get started, my self-disclosures last a long time."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 4
      slug: rsds_4
      type: likert_5
      prompt:
        en: "I do not often share information about myself."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: true

    - order: 5
      slug: rsds_5
      type: likert_5
      prompt:
        en: "I usually share what I really feel and think."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 6
      slug: rsds_6
      type: likert_5
      prompt:
        en: "When I share things, I usually share things that are personal."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 7
      slug: rsds_7
      type: likert_5
      prompt:
        en: "I usually share intimate, personal things about myself."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 8
      slug: rsds_8
      type: likert_5
      prompt:
        en: "I usually keep my personal feelings to myself."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: true

    - order: 9
      slug: rsds_9
      type: likert_5
      prompt:
        en: "When I share something, I let others know exactly how I feel about it."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 10
      slug: rsds_10
      type: likert_5
      prompt:
        en: "When I share, I am consciously willing to reveal personal information about myself."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false


# ============================================================================
# DAY 3 — ISCS BONDING (Internet Social Capital Scale, bonding subscale)
# ============================================================================
# Source: Williams (2006). 10 items measuring bonding social capital
# (close, emotional, support-providing ties).
# Higher score = stronger bonding ties in your network.

- slug: sotd_d03_iscs_bond
  type: likert_5
  title:
    en: "How close are your closest people?"
  description:
    en: "Today's questions are about your closest relationships — the people you actually rely on. Think about your circle in general, not WIT specifically."
  interpretation:
    en: "Higher scores mean you have strong, emotionally close ties — people you can lean on. Lower scores mean your support network is thinner or less close. Both are common; neither is better."
  friend_visible: false
  results_hidden: false
  result_kind: scale_score_histogram

  questions:
    - order: 1
      slug: iscs_bond_1
      type: likert_5
      prompt:
        en: "There are several people I trust to help solve my problems."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 2
      slug: iscs_bond_2
      type: likert_5
      prompt:
        en: "If I needed an emergency loan of $500, I know someone I can turn to."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 3
      slug: iscs_bond_3
      type: likert_5
      prompt:
        en: "There is someone I can turn to for advice about making very important decisions."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 4
      slug: iscs_bond_4
      type: likert_5
      prompt:
        en: "There is no one I feel comfortable talking to about intimate personal problems."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: true

    - order: 5
      slug: iscs_bond_5
      type: likert_5
      prompt:
        en: "When I feel lonely, there are several people I can talk to."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
