      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 7
      slug: iscs_bond_7
      type: likert_5
      prompt:
        en: "The people I'm close with would put their reputation on the line for me."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 8
      slug: iscs_bond_8
      type: likert_5
      prompt:
        en: "The people I'm close with would help me fight an injustice."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false

    - order: 9
      slug: iscs_bond_9
      type: likert_5
      prompt:
        en: "I do not know people well enough to get them to do anything important."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: true

    - order: 10
      slug: iscs_bond_10
      type: likert_5
      prompt:
        en: "The people I'm close with and I want the same things from life."
      low_label:  { en: "Strongly disagree" }
      high_label: { en: "Strongly agree" }
      reverse_scored: false


