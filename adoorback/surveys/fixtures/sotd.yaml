# ============================================================================
# DAY 5 — RSQ-Brief (Rejection Sensitivity Questionnaire, 8 situations)
# ============================================================================
# Source: Berenson et al. (2009) RSQ-Brief / Adult RSQ-9 short form.
# Each situation has TWO items: anxiety/concern + expected acceptance.
# Score per situation = anxiety × (7 − expectation), summed across situations.
# This requires a derived score formula — see implementation note.
# Higher score = higher rejection sensitivity.

- slug: sotd_d05_rsq
  type: likert_6
  title:
    en: "How do you feel about asking for things?"
  description:
    en: "Today's questions describe situations where you might ask someone for something, and how you'd feel about it. There are no right answers — go with your gut."
  interpretation:
    en: "Higher scores mean you tend to anticipate rejection more strongly when asking things of others. Lower scores mean you generally expect things to go fine. Neither is better — both are normal ways of approaching social situations."
  friend_visible: false
  results_hidden: false
  result_kind: scale_score_histogram
  score_formula: "rsq_brief_weighted"

  questions:
    - order: 1
      slug: rsq_situation_1_intro
      type: display_only
      content:
        en: "**Situation 1.** You ask your boyfriend/girlfriend or a person you've been dating to move in with you."

    - order: 2
      slug: rsq_1_concern
      type: likert_6
      prompt:
        en: "How concerned or anxious would you be over how the person would respond?"
      options:
        - { order: 1, value: 1, label: { en: "Very unconcerned" } }
        - { order: 2, value: 2, label: { en: "Unconcerned" } }
        - { order: 3, value: 3, label: { en: "Somewhat unconcerned" } }
        - { order: 4, value: 4, label: { en: "Somewhat concerned" } }
        - { order: 5, value: 5, label: { en: "Concerned" } }
        - { order: 6, value: 6, label: { en: "Very concerned" } }
      reverse_scored: false

    - order: 3
      slug: rsq_1_expect
      type: likert_6
      prompt:
        en: "I would expect that they would want to."
      options:
        - { order: 1, value: 1, label: { en: "Very unlikely" } }
        - { order: 2, value: 2, label: { en: "Unlikely" } }
        - { order: 3, value: 3, label: { en: "Somewhat unlikely" } }
        - { order: 4, value: 4, label: { en: "Somewhat likely" } }
        - { order: 5, value: 5, label: { en: "Likely" } }
        - { order: 6, value: 6, label: { en: "Very likely" } }
      reverse_scored: false

    - order: 4
      slug: rsq_situation_2_intro
      type: display_only
      content:
        en: "**Situation 2.** You ask a friend if they can do you a big favor."

    - order: 5
