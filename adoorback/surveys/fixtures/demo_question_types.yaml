# --- Multi-panel demo ------------------------------------------------------
# Mixed-type questions render as separate panels on the results page so QA
# can see histogram + option counts + wordcloud stacked together.

- slug: demo_multi_panel
  title:
    en: "Demo · Multi-panel results"
    ko: "데모 · 다중 패널"
  description:
    en: "Slider + single choice + free text on one survey — three result panels."
    ko: "슬라이더 + 단일 선택 + 자유 응답 — 결과 패널 3개."
  friend_visible: true
  results_hidden: false
  questions:
    - order: 1
      type: slider
      prompt: { en: "How was your day overall?", ko: "오늘 하루는 어땠나요?" }
      low_label: { en: "Awful", ko: "끔찍" }
      high_label: { en: "Wonderful", ko: "최고" }
      slider_min_value: 0
      slider_max_value: 10
      result_kind: slider_histogram
    - order: 2
      type: single_choice
      prompt: { en: "Where did you spend most of your day?", ko: "오늘 가장 오래 머문 곳은?" }
      result_kind: option_counts
      options:
        - { order: 1, value: 1, label: { en: "Home",     ko: "집" } }
        - { order: 2, value: 2, label: { en: "Work",     ko: "직장" } }
        - { order: 3, value: 3, label: { en: "School",   ko: "학교" } }
        - { order: 4, value: 4, label: { en: "Outdoors", ko: "야외" } }
        - { order: 5, value: 5, label: { en: "Other",    ko: "기타" } }
    - order: 3
      type: free_text
      prompt: { en: "One thing you're looking forward to?", ko: "기대되는 한 가지?" }
      result_kind: wordcloud
