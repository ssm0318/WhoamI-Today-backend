version: "3.8"
services:
  web:
    image: whoami-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.development
    environment:
      - DJANGO_ENV=development
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy # ✅ Wait until DB is running normally
    command: /app/start.sh
    networks:
      - whoamitoday-network

  db:
    image: postgres:13
    env_file:
      - .env.development
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: # ✅ Check PostgreSQL status
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - whoamitoday-network

  cron:
    image: whoami-backend:latest
    env_file:
      - .env.development
    volumes:
      - ./cron:/app/cron
      - ./db_backup:/app/db_backup
      - ./.env.development:/app/.env.development
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c '
      crontab /app/cron/crontab_jobs &&
      cron -f
      '
    networks:
      - whoamitoday-network

volumes:
  postgres_data:
    driver: local

networks:
  whoamitoday-network:
    external: true
